<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon Page</title>

    <!-- 1. Fonts first — so nothing renders in a fallback then jumps -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<!-- 2. Bootstrap — the base layer you're customising -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- 3. Your layers, in cascade order -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/effects.css">

</head>
<body>
    <div class="page-wrapper">
        <div class="container">
        <img src="images/logo.png" alt="Logo" class="logo">

        <div class="content">
            <p>We are working hard to bring you something awesome. Stay tuned!</p>
            <h1>ProjectX <span>Launching</span> Soon</h1>
            <div class="launch-time">
                <div>
                    <p id="days">00</p>
                    <span>Days</span>
                </div>
                <div>
                    <p id="hours">00</p>
                    <span>Hours</span>
                </div>
                <div>
                    <p id="minutes">00</p>
                    <span>Minutes</span>
                </div>
                <div>
                    <p id="seconds">00</p>
                    <span>Seconds</span>
                </div>
            </div>
            
            </div>
            <button class="notify-btn">Discover More <img src="images/arrow.png" alt=""> </button>

        <img src="images/ship.png" class="ship">
    </div>
    </div>

    
    <script src="app.js"></script>
</body>
</html>
