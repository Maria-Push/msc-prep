<?xml version="1.0" encoding="UTF-8"?>
<!--
  CIRCUIT TEXTURE TILE

  Used as a CSS mask-image, not a background-image. That is deliberate:
  an SVG loaded through url() is an isolated document and cannot see your
  CSS variables, so its colours would live outside your token system.
  As a MASK it only supplies the SHAPE - the colour comes from
  background-color on the element, which can be a token.

  Because it is a mask, only ALPHA matters here. The stroke colour is
  irrelevant; what counts is opaque vs transparent. Varying stroke-opacity
  gives the texture depth - some traces read as nearer than others.

  Tiling: every line that leaves the tile does so at a coordinate that its
  neighbour also uses, so edges meet. Diagonals and stubs stay entirely
  inside the tile, where seams cannot betray them.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round">

    <!-- ===== Edge-to-edge rails. These are what make the tile read as a
              continuous board rather than repeated stamps. ===== -->
    <path d="M40 0 V200"  stroke-opacity="0.55"/>
    <path d="M128 0 V200" stroke-opacity="0.40"/>
    <path d="M0 62 H200"  stroke-opacity="0.50"/>
    <path d="M0 152 H200" stroke-opacity="0.35"/>

    <!-- ===== Branches with 45-degree elbows. Sharp angles only - curves
              would read as plumbing, not circuitry. ===== -->
    <path d="M40 62 L72 94 L72 152"        stroke-opacity="0.45"/>
    <path d="M128 62 L160 94 L160 128"     stroke-opacity="0.35"/>
    <path d="M40 152 L8 184"               stroke-opacity="0.30"/>
    <path d="M128 152 L96 184 L96 200"     stroke-opacity="0.30"/>
    <path d="M0 30 L18 30 L34 14"          stroke-opacity="0.25"/>
    <path d="M200 100 L176 100 L164 88"    stroke-opacity="0.25"/>

    <!-- ===== Dead-end stubs. Real boards are full of them, and they stop
              the pattern looking like a grid. ===== -->
    <path d="M40 100 H14"   stroke-opacity="0.30"/>
    <path d="M128 186 H150" stroke-opacity="0.25"/>
    <path d="M72 20 V44"    stroke-opacity="0.25"/>
  </g>

  <!-- ===== Vias and pads at the junctions ===== -->
  <g fill="#fff">
    <circle cx="40"  cy="62"  r="3.2" fill-opacity="0.55"/>
    <circle cx="128" cy="62"  r="2.6" fill-opacity="0.40"/>
    <circle cx="40"  cy="152" r="2.6" fill-opacity="0.40"/>
    <circle cx="128" cy="152" r="3.2" fill-opacity="0.35"/>
    <circle cx="72"  cy="94"  r="2.2" fill-opacity="0.35"/>
    <circle cx="160" cy="94"  r="2.2" fill-opacity="0.30"/>
    <circle cx="14"  cy="100" r="2.6" fill-opacity="0.30"/>
    <circle cx="150" cy="186" r="2.2" fill-opacity="0.25"/>
    <circle cx="72"  cy="20"  r="2.2" fill-opacity="0.25"/>
  </g>

  <!-- ===== Chips: the small rectangles that make a board look populated ===== -->
  <g fill="none" stroke="#fff" stroke-width="1">
    <rect x="86"  y="112" width="26" height="16" rx="2" stroke-opacity="0.30"/>
    <rect x="150" y="36"  width="18" height="12" rx="2" stroke-opacity="0.22"/>
  </g>
</svg>
